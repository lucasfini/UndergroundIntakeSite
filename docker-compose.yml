version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: underground_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: underground
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: underground_intake
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
